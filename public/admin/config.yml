backend:
  name: github
  repo: gingerheart86/yaqupachauylanding
  branch: main
  base_url: https://yaqupachauy.org
  auth_endpoint: api/auth

media_folder: "public/uploads"
public_folder: "/uploads"

# Redimensiona al subir para que una foto de celular (5-8 MB) no vaya
# al repo tal cual. 1600 px de lado largo, formato webp. El hint de
# "Menos de 2 MB" en el campo "imagen" sigue siendo la referencia para
# quien sube el archivo; esto es la red de contencion automatica.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: "webp"
          quality: 85
          width: 1600
          height: 1600

collections:
  - name: "paginas"
    label: "Páginas"
    files:
      - name: "la-ong"
        label: "Nosotros — Asociación Civil"
        file: "content/paginas/la-ong.mdx"
        fields:
          - { name: "titulo", label: "Título (ES)", widget: "string" }
          - { name: "titulo_en", label: "Título (EN)", widget: "string" }
          - { name: "resumen", label: "Bajada (ES)", widget: "text" }
          - { name: "resumen_en", label: "Bajada (EN)", widget: "text" }
          - { name: "imagen", label: "Imagen principal", widget: "image", required: false, hint: "Menos de 2 MB." }
          - { name: "alt", label: "Descripción de la imagen (ES)", widget: "string", required: false }
          - { name: "alt_en", label: "Descripción de la imagen (EN)", widget: "string", required: false }
          - { name: "body", label: "Contenido (ES)", widget: "markdown" }
          - { name: "body_en", label: "Contenido (EN)", widget: "markdown" }

      - name: "home-institucional"
        label: "Portada — Sección institucional"
        file: "content/paginas/home-institucional.mdx"
        fields:
          - { name: "titulo", label: "Título de la sección (ES)", widget: "string" }
          - { name: "titulo_en", label: "Título de la sección (EN)", widget: "string" }
          - { name: "body", label: "Texto (ES)", widget: "markdown", hint: "Va sobre la textura, conviene que sea breve." }
          - { name: "body_en", label: "Texto (EN)", widget: "markdown", hint: "Va sobre la textura, conviene que sea breve." }

      - name: "donaciones"
        label: "Colaborá — Donaciones"
        file: "content/paginas/donaciones.mdx"
        fields:
          - { name: "titulo", label: "Título", widget: "string" }
          - { name: "intro", label: "Introducción", widget: "text", hint: "A qué se destinan los fondos.", required: false }
          - { name: "body", label: "Datos para donar", widget: "markdown", hint: "Revisá los números de cuenta dos veces antes de guardar. Solo español: /colabora/donaciones no tiene versión en inglés." }

      - name: "reportar-avistamiento"
        label: "Colaborá — Reportar un avistamiento"
        file: "content/paginas/reportar-avistamiento.mdx"
        fields:
          - { name: "titulo", label: "Título (ES)", widget: "string" }
          - { name: "titulo_en", label: "Título (EN)", widget: "string" }
          - { name: "body", label: "Texto explicativo (ES)", widget: "markdown", hint: "Importancia de los registros oportunistas para el monitoreo y la ciencia ciudadana." }
          - { name: "body_en", label: "Texto explicativo (EN)", widget: "markdown" }
          - { name: "aclaracion_varamiento", label: "Aclaración sobre varamientos (ES)", widget: "text", hint: "Un avistamiento es de animales vivos. Si está muerto o varado, es un varamiento." }
          - { name: "aclaracion_varamiento_en", label: "Aclaración sobre varamientos (EN)", widget: "text" }

      - name: "identificacion"
        label: "Colaborá — Guía de identificación"
        file: "content/paginas/identificacion.mdx"
        fields:
          - { name: "titulo", label: "Título", widget: "string" }
          - { name: "intro", label: "Introducción", widget: "text", required: false }
          - { name: "cierre_educativo", label: "Cierre educativo", widget: "markdown", required: false, hint: "Qué es un cetáceo, diferencia entre misticetos y odontocetos. Requiere revisión biológica antes de publicarse (Bloque 6)." }

      - name: "contacto"
        label: "Colaborá — Contacto"
        file: "content/paginas/contacto.mdx"
        fields:
          - { name: "titulo", label: "Título (ES)", widget: "string" }
          - { name: "titulo_en", label: "Título (EN)", widget: "string" }
          - { name: "direccion", label: "Dirección", widget: "string" }
          - { name: "email", label: "Correo", widget: "string" }

      - name: "libros"
        label: "Educación — Libros (intro)"
        file: "content/paginas/libros.mdx"
        fields:
          - { name: "titulo", label: "Título", widget: "string" }
          - { name: "intro", label: "Introducción", widget: "text" }

      - name: "voluntariado"
        label: "Colaborá — Voluntariado"
        file: "content/paginas/voluntariado.mdx"
        fields:
          - { name: "titulo", label: "Título", widget: "string" }
          - { name: "intro", label: "Introducción", widget: "markdown", hint: "Qué implica ser voluntaria, qué se espera, épocas del año." }
          - name: "campos"
            label: "Campos del formulario"
            widget: "list"
            required: false
            hint: "Vacío mientras el equipo confirma los campos reales (ver el formulario actual). Con la lista vacía, la página muestra el enlace al formulario de Google en su lugar."
            fields:
              - { name: "nombre", label: "Nombre del campo", widget: "string", hint: "Ej: telefono. Sin espacios ni acentos." }
              - { name: "etiqueta", label: "Etiqueta visible", widget: "string" }
              - name: "tipo"
                label: "Tipo"
                widget: "select"
                options: ["texto", "texto largo", "email", "teléfono", "selección", "casilla"]
              - { name: "opciones", label: "Opciones", widget: "text", required: false, hint: "Solo para 'selección'. Una por línea." }
              - { name: "obligatorio", label: "Obligatorio", widget: "boolean", default: false }
          - { name: "mensaje_exito", label: "Mensaje al enviar", widget: "text" }
          - { name: "aviso_datos", label: "Aviso sobre los datos", widget: "text", hint: "Qué se hace con la información que deja la persona." }

  - name: "noticias"
    label: "Noticias"
    folder: "content/noticias"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    extension: "mdx"
    fields:
      - { name: "titulo", label: "Título", widget: "string" }
      - { name: "fecha", label: "Fecha", widget: "datetime", format: "YYYY-MM-DD" }
      - name: "categoria"
        label: "Categoría"
        widget: "select"
        options: ["Institucional", "Ciencia", "Educación ambiental", "Prensa"]
      - { name: "resumen", label: "Resumen", widget: "text", hint: "Dos o tres líneas. Aparece en el listado y al compartir en redes." }
      - { name: "imagen", label: "Imagen principal", widget: "image", required: false, hint: "Menos de 2 MB." }
      - { name: "alt", label: "Descripción de la imagen", widget: "string", required: false, hint: "Para quienes usan lector de pantalla. Describí qué se ve." }
      - { name: "destacada", label: "Destacada en portada", widget: "boolean", default: false }
      - { name: "body", label: "Contenido", widget: "markdown" }

  - name: "especies"
    label: "Especies"
    folder: "content/especies"
    create: true
    identifier_field: "nombre_comun"
    fields:
      - { name: "nombre_comun", label: "Nombre común (ES)", widget: "string" }
      - { name: "nombre_comun_en", label: "Nombre común (EN)", widget: "string", required: false }
      - { name: "nombre_cientifico", label: "Nombre científico", widget: "string", hint: "Se muestra en cursiva automáticamente." }
      - { name: "imagen", label: "Imagen principal", widget: "image", required: false }
      - { name: "alt", label: "Descripción de la imagen (ES)", widget: "string", required: false }
      - { name: "alt_en", label: "Descripción de la imagen (EN)", widget: "string", required: false }
      - { name: "resumen", label: "Bajada (ES)", widget: "text" }
      - { name: "resumen_en", label: "Bajada (EN)", widget: "text", required: false }
      - { name: "body", label: "Contenido (ES)", widget: "markdown", hint: "Escribir siempre las cifras como estimaciones: 'se estimó en', 'las estimaciones rondan'. Nunca 'hay' ni 'quedan'. Para insertar una foto en su lugar exacto: <Foto src=\"/ruta/imagen.webp\" alt=\"Qué se ve\" epigrafe=\"Texto al pie\" />. El alt es obligatorio." }
      - { name: "body_en", label: "Contenido (EN)", widget: "markdown", required: false }
      - { name: "orden", label: "Orden", widget: "number", default: 0 }

  - name: "proyectos"
    label: "Proyectos"
    folder: "content/proyectos"
    create: true
    identifier_field: "nombre"
    fields:
      - { name: "nombre", label: "Nombre (ES)", widget: "string" }
      - { name: "nombre_en", label: "Nombre (EN)", widget: "string", required: false }
      - { name: "resumen", label: "Bajada (ES)", widget: "text" }
      - { name: "resumen_en", label: "Bajada (EN)", widget: "text", required: false }
      - { name: "silueta", label: "Silueta", widget: "image", required: false }
      - { name: "body", label: "Contenido (ES)", widget: "markdown", hint: "Para insertar una foto en su lugar exacto: <Foto src=\"/ruta/imagen.webp\" alt=\"Qué se ve\" epigrafe=\"Texto al pie\" />. Para un par lado a lado: <ParFotos><Foto .../><Foto .../></ParFotos>. El alt es obligatorio." }
      - { name: "body_en", label: "Contenido (EN)", widget: "markdown", required: false }
      - name: "registro"
        label: "Registro visual"
        widget: "select"
        options: ["alto", "sobrio"]
        default: "sobrio"
        hint: "Alto solo para Proyecto Toninas, que es exclusivo de Yaqu Pacha. Los proyectos compartidos van sobrios."
      - { name: "destacado", label: "Destacado en portada", widget: "boolean", default: false }
      - { name: "orden", label: "Orden", widget: "number", default: 0 }

  - name: "publicaciones"
    label: "Publicaciones científicas"
    folder: "content/publicaciones"
    create: true
    identifier_field: "titulo"
    fields:
      - { name: "doi", label: "DOI", widget: "string", required: false, hint: "Solo el identificador, sin https://doi.org/. Ej: 10.1016/j.biocon.2026.111865. Tesis, informes técnicos y capítulos de libro no suelen tener." }
      - { name: "titulo", label: "Título", widget: "string" }
      - { name: "autores", label: "Autores", widget: "text", hint: "Como van en la cita. Poner en negrita (**Nombre**) a quienes son del equipo." }
      - { name: "revista", label: "Revista", widget: "string" }
      - { name: "anio", label: "Año", widget: "number", value_type: "int" }
      - { name: "volumen", label: "Volumen", widget: "string", required: false }
      - { name: "paginas", label: "Páginas o número de artículo", widget: "string", required: false }
      - name: "especie"
        label: "Especie"
        widget: "select"
        multiple: true
        required: false
        options: ["Tonina", "Ballena franca austral", "Franciscana", "Orca", "Varias", "Otra"]
      - name: "proyecto"
        label: "Proyecto asociado"
        widget: "select"
        required: false
        options: ["Proyecto Toninas", "Gephyreus", "Grupo de Trabajo en Varamientos", "Identidad Franca", "Ninguno"]
      - { name: "autoria_yaqu", label: "Con autoría de Yaqu Pacha", widget: "boolean", default: true }
      - { name: "acceso_abierto", label: "Acceso abierto", widget: "boolean", default: false }
      - { name: "resumen_es", label: "Resumen en español", widget: "text", required: false, hint: "Dos o tres líneas en lenguaje llano. No es el abstract traducido." }

  - name: "materiales"
    label: "Materiales educativos"
    folder: "content/materiales"
    create: true
    fields:
      - { name: "titulo", label: "Título", widget: "string" }
      - { name: "descripcion", label: "Descripción", widget: "text" }
      - { name: "miniatura", label: "Miniatura", widget: "image" }
      - { name: "archivo_pantalla", label: "PDF liviano (pantalla)", widget: "file" }
      - { name: "archivo_impresion", label: "PDF de impresión", widget: "file", required: false }
      - { name: "credito", label: "Crédito", widget: "string", required: false }
      - { name: "orden", label: "Orden", widget: "number", default: 0 }

  - name: "integrantes"
    label: "Integrantes"
    folder: "content/integrantes"
    create: true
    identifier_field: "nombre"
    fields:
      - { name: "nombre", label: "Nombre", widget: "string" }
      - name: "grupo"
        label: "Grupo"
        widget: "select"
        options: ["Equipo científico y dirección", "Equipo artístico"]
        default: "Equipo científico y dirección"
      - { name: "rol", label: "Rol", widget: "string", required: false }
      - { name: "foto", label: "Foto", widget: "image", hint: "Cuadrada si es posible, menos de 2 MB." }
      - { name: "alt", label: "Descripción de la foto", widget: "string", required: false }
      - { name: "bio", label: "Reseña (ES)", widget: "text", required: false }
      - { name: "bio_en", label: "Reseña (EN)", widget: "text", required: false }
      - { name: "formacion", label: "Formación", widget: "string", required: false }
      - { name: "orcid", label: "ORCID", widget: "string", required: false, hint: "Solo el identificador, sin la URL." }
      - { name: "twitter", label: "Twitter / X", widget: "string", required: false }
      - { name: "linkedin", label: "LinkedIn", widget: "string", required: false }
      - { name: "activa", label: "Activa en el equipo", widget: "boolean", default: true, hint: "Desmarcada, desaparece de la grilla pero la ficha se conserva." }
      - { name: "orden", label: "Orden", widget: "number", default: 0 }

  - name: "prensa"
    label: "Prensa y divulgación"
    folder: "content/prensa"
    create: true
    identifier_field: "titulo"
    fields:
      - { name: "titulo", label: "Título", widget: "string" }
      - { name: "medio", label: "Medio", widget: "string", hint: "Ej: la diaria, Canal 5, Radio Uruguay." }
      - { name: "fecha", label: "Fecha", widget: "datetime", format: "YYYY-MM-DD", required: false, hint: "Dejar vacío si no se conoce. Si se sabe el mes pero no el día, usar AAAA-MM-XX." }
      - name: "tipo"
        label: "Tipo"
        widget: "select"
        options: ["Nota", "Video", "Radio", "Podcast", "Otro"]
      - { name: "url", label: "Enlace", widget: "string", required: false, hint: "Vacío para citas de material impreso sin versión digital." }
      - { name: "miniatura", label: "Miniatura", widget: "image", required: false }
      - { name: "alt", label: "Descripción de la miniatura", widget: "string", required: false }
      - { name: "resumen", label: "Resumen", widget: "text", required: false }

  - name: "libros"
    label: "Libros"
    folder: "content/libros"
    create: true
    fields:
      - { name: "titulo", label: "Título", widget: "string" }
      - { name: "tapa", label: "Tapa", widget: "image" }
      - { name: "sinopsis", label: "Sinopsis", widget: "text" }
      - { name: "edad", label: "Edad recomendada", widget: "string", required: false }
      - { name: "guion", label: "Guion", widget: "string", default: "Silvia Soler" }
      - { name: "ilustraciones", label: "Ilustraciones", widget: "string", default: "Yez" }
      - { name: "editorial", label: "Editorial", widget: "string", default: "Krakatoa" }
      - { name: "catalogo", label: "Individuo del catálogo", widget: "string", required: false, hint: "Código si el protagonista es un individuo real. Ej: URU#001" }
      - { name: "disponible", label: "Disponible para la venta", widget: "boolean", default: true }

  - name: "catalogo"
    label: "Catálogo de individuos"
    folder: "content/catalogo"
    create: true
    identifier_field: "nombre"
    slug: "{{fields.codigo}}-{{fields.nombre}}"
    fields:
      - { name: "codigo", label: "Código de catálogo", widget: "string", hint: "Ej: URU#001. El '#' no se puede usar en la URL - el nombre del archivo lo reemplaza automáticamente por un guion." }
      - { name: "nombre", label: "Nombre", widget: "string" }
      - { name: "lugar", label: "Lugar de identificación", widget: "string", hint: "Ej: La Coronilla, Rocha - Uruguay" }
      - name: "proyecto"
        label: "Proyecto"
        widget: "select"
        options:
          - { label: "Proyecto Toninas", value: "toninas" }
          - { label: "Identidad Franca", value: "identidad-franca" }
        default: "toninas"
      - name: "especie"
        label: "Especie"
        widget: "select"
        options: ["Tonina", "Ballena franca austral"]
        default: "Tonina"
      - name: "fotos"
        label: "Fotos"
        widget: "list"
        fields:
          - { name: "src", label: "Foto", widget: "image", hint: "Máximo 800 px, con marca de agua." }
          - { name: "vista", label: "Qué se ve", widget: "string", hint: "Ej: aleta dorsal, lado izquierdo." }
      - { name: "stamp", label: "Estampilla", widget: "image", required: false, hint: "Ilustración de la aleta en línea, fondo transparente." }
      - { name: "descripcion", label: "Descripción", widget: "text", required: false }
      - { name: "historia", label: "Historia", widget: "markdown", required: false, hint: "El relato del individuo. Se muestra al abrir la ficha." }
      - { name: "primer_avistamiento", label: "Primer avistamiento", widget: "datetime", format: "YYYY-MM-DD", hint: "Fecha del primer registro del animal, no del alta en el catálogo." }
      - { name: "ultimo_avistamiento", label: "Último avistamiento", widget: "datetime", format: "YYYY-MM-DD", required: false, hint: "Provisorio: se actualiza por temporada hasta que exista el enlace con la capa de ArcGIS." }
      - name: "sexo"
        label: "Sexo"
        widget: "select"
        required: false
        options: ["Hembra", "Macho"]
        hint: "Vacío si no se conoce. No se muestra si está vacío."
      - { name: "muerto", label: "Registrado muerto", widget: "boolean", default: false, hint: "Marcar SOLO si se encontró el animal muerto. Dejar de verse no es evidencia de muerte. La ficha sigue publicada; no se muestra causa de muerte." }
      - { name: "arcgis_id", label: "ID en la capa de ArcGIS", widget: "string", required: false }
      - { name: "libro", label: "Libro donde aparece", widget: "string", required: false, hint: "Slug del libro. Ej: muescagrande-la-tonina" }
      - { name: "publicado", label: "Visible en el sitio", widget: "boolean", default: true, hint: "Desmarcar mientras se confirma la identificación." }

  - name: "tienda"
    label: "Yaqutienda"
    folder: "content/tienda"
    create: true
    identifier_field: "nombre"
    fields:
      - { name: "nombre", label: "Nombre del artículo", widget: "string" }
      - { name: "precio", label: "Precio", widget: "number", value_type: "int", hint: "En pesos uruguayos, sin puntos ni símbolo." }
      - name: "fotos"
        label: "Fotos"
        widget: "list"
        fields:
          - { name: "src", label: "Foto", widget: "image", hint: "Menos de 2 MB." }
          - { name: "alt", label: "Descripción de la foto", widget: "string" }
      - { name: "descripcion", label: "Descripción", widget: "text", required: false }
      - name: "categoria"
        label: "Categoría"
        widget: "select"
        options: ["Libros", "Indumentaria", "Accesorios", "Otros"]
      - name: "variantes"
        label: "Variantes"
        widget: "list"
        required: false
        hint: "Talles, colores. Dejar vacío si el artículo no tiene variantes."
        fields:
          - { name: "opcion", label: "Opción", widget: "string" }
      - { name: "disponible", label: "Disponible", widget: "boolean", default: true, hint: "Desmarcado, sigue visible pero no se puede agregar al carrito." }
      - { name: "orden", label: "Orden", widget: "number", default: 0 }

# especies, proyectos, publicaciones y catalogo estan en el panel
# (arriba), pero llevan cifras con intervalo de confianza
# (especies/proyectos) o un criterio sensible sobre "muerto"
# (catalogo) - ver el hint de cada campo antes de editar a mano.
